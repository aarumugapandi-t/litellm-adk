[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-adk"
version = "0.3.1"
description = "A portable and resilient Multi-Agent Development Kit for LLM orchestration and safety."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

classifiers = [
  "Programming Language :: Python :: 3"
]

dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "orjson>=3.10.0",
    "sqlalchemy>=2.0.0",
    "sqlparse>=0.4.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.0.0",
    "Pillow>=10.0.0",
    "aiosqlite>=0.19.0",
    "motor>=3.3.0",
    "tenacity>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/aarumugapandi400267/litellm-adk"
Repository = "https://github.com/aarumugapandi400267/litellm-adk"
Issues = "https://github.com/aarumugapandi400267/litellm-adk/issues"
Documentation = "https://github.com/aarumugapandi400267/litellm-adk#readme"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "isort",
    "mypy"
]
embeddings = [
    "sentence-transformers>=2.0.0"
]
telemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]